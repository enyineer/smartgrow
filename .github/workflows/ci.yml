name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - name: Install test dependencies (uv sync incl. test extra + dev group)
        run: |
          uv sync --extra test --group dev --no-editable
          # belt & braces: no editable finder artifacts may remain in site-packages
          find .venv -maxdepth 4 -name '__editable__*' -print -delete || true
      - uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: card-src/package-lock.json
      - name: Build card bundle (needed by the frontend invariant tests)
        run: |
          cd card-src
          npm ci
          npm run build
      - name: Ruff
        run: uv run ruff check custom_components/smartgrow tests
      - name: Black (check)
        run: uv run black --check custom_components/smartgrow tests
      - name: Pytest with coverage
        run: |
          uv run pytest tests/ \
            --cov=custom_components/smartgrow/logic \
            --cov=custom_components/smartgrow/adaptation \
            --cov-report=term --cov-fail-under=90

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hassfest validation
        uses: home-assistant/actions/hassfest@master

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
